name: build docs on push
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  create-docs:
    # The reusable workflow lives in this repository, so reference it locally. Pointing
    # at a branch of a fork meant the build could differ from what is checked in here.
    uses: ./.github/workflows/run-doctoolchain.yml
    secrets: inherit
    with:
      dtc-process-targets: generatePDF generateHTML
      dtc-output-pattern: build/
